# uv tool install pre-commit
# pre-commit
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # pin the same version as in pyproject.toml
    rev: v0.15.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        pass_filenames: false
        types: [python]
